[project]
name = "lcdoctor"
version = "0.1.0"
description = "Find the LangChain imports that will break when you upgrade, and where each one lives now."
readme = "README.md"
license = "MIT"
authors = [{ name = "Reet Batra", email = "reetbatra25@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["langchain", "langgraph", "upgrade", "migration", "deprecation", "devtools"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/reetbatra/lcdoctor"

[project.scripts]
lcdoctor = "lcdoctor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcdoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: builds real virtualenvs with uv and installs LangChain (slow, needs network)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# `ruff format` owns line length; what remains is long string literals.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Must stay Python 3.8 compatible and stdlib-only: it runs in the user's interpreter.
"src/lcdoctor/_probe.py" = ["UP"]

[tool.mypy]
strict = true
files = ["src/lcdoctor"]

[[tool.mypy.overrides]]
# Runs inside the user's interpreter (stdlib only, Python 3.8 syntax), so it stays unannotated.
module = "lcdoctor._probe"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "lcdoctor.*"
disallow_untyped_calls = false
